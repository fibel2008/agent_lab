<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>对话 · Emibot</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235ba4d4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/chat.css">
</head>
<body>
  <svg class="app-svg-sprite" aria-hidden="true">
    <symbol id="icon-brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"></path>
      <path d="M12 12l8-4.5"></path>
      <path d="M12 12v9"></path>
      <path d="M12 12L4 7.5"></path>
    </symbol>
    <symbol id="icon-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
    </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
      <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
      <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
    </symbol>
    <symbol id="icon-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="2"></rect>
      <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
    </symbol>
    <symbol id="icon-device" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
      <path d="M12 18h.01"></path>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </symbol>
    <symbol id="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 2 11 13"></path>
      <path d="M22 2 15 22 11 13 2 9 22 2z"></path>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </symbol>
    <symbol id="icon-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"></polyline>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
    </symbol>
  </svg>

  <a class="skip-link" href="#main-content">跳到主内容</a>

  <header class="app-header">
    <a class="app-brand" href="#/chat" aria-label="Emibot 首页">
      <span class="app-brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><use href="#icon-brand"></use></svg>
      </span>
      <span class="app-brand__name">Emibot</span>
    </a>
    <span class="app-header__divider" aria-hidden="true"></span>
    <h1 class="app-header__title" id="page-title">对话</h1>
    <div class="app-header__spacer"></div>
    <span class="badge badge--mock"><span class="badge__dot"></span>Mock 模式</span>
    <span class="app-header__version">v0.1.0</span>
  </header>

  <div class="app-body">
    <aside class="app-sidebar">
      <nav class="nav" aria-label="主导航">
        <ul class="nav__list" id="nav-list"></ul>
      </nav>
      <div class="app-sidebar__footer">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="app-sidebar__footer-text">本地运行 · v0.1.0</span>
      </div>
    </aside>

    <main class="app-main" id="main-content">
      <section class="view view--chat" id="view-chat" aria-label="对话主窗口">
        <aside class="chat-sessions" id="chat-sessions" aria-label="会话列表">
          <div class="chat-sessions__header">
            <div class="chat-sessions__reserved" id="chat-sessions-reserved" aria-hidden="true"></div>
            <button class="chat-sessions__new-btn" id="new-chat-button" type="button">
              <svg class="chat-sessions__new-icon" viewBox="0 0 24 24"><use href="#icon-plus"></use></svg>
              <span>新建对话</span>
            </button>
          </div>
          <ul class="chat-sessions__list" id="chat-sessions-list" role="list"></ul>
        </aside>
        <div class="chat" id="chat-main">
          <div class="chat__scroll" id="chat-scroll">
            <div class="chat__empty" id="chat-empty">
              <span class="chat__empty-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><use href="#icon-chat"></use></svg>
              </span>
              <h2 class="chat__empty-title">开始和 Agent 对话</h2>
              <p class="chat__empty-text">当前回复由本地 mock 生成，用来验证对话界面与流式输出。</p>
            </div>
            <div class="chat__messages" id="messages"></div>
          </div>
          <div class="chat__composer">
            <p class="composer__queue" id="composer-queue" hidden></p>
            <form class="composer" id="composer">
              <div class="composer__row">
                <textarea
                  class="composer__input"
                  id="composer-input"
                  rows="1"
                  maxlength="4000"
                  placeholder="给 Emibot 发送消息..."
                  aria-label="输入消息"
                ></textarea>
                <button
                  class="composer__send"
                  id="send-button"
                  type="submit"
                  disabled
                  aria-label="发送消息"
                >
                  <svg viewBox="0 0 24 24"><use href="#icon-send"></use></svg>
                </button>
              </div>
            </form>
            <p class="composer__hint">Enter 发送 · Shift + Enter 换行</p>
          </div>
        </div>
      </section>
      <section class="view view--placeholder" id="view-placeholder" hidden></section>
    </main>
  </div>

  <div class="sr-only" id="live-status" role="status" aria-live="polite"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
